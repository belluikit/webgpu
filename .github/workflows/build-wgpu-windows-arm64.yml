name: Build wgpu-native (windows/arm64, GNU ABI)

# Upstream wgpu-native releases ship an aarch64-pc-windows-MSVC lib, whose
# SEH/vcruntime C++ EH cannot be linked by the llvm-mingw toolchain Go/cgo uses on
# windows/arm64 — so windows/arm64 has no usable prebuilt. This job rebuilds that
# one slice with the GNU (gnullvm) ABI, exactly as the amd64 target uses -gnu.
#
# Every other slice comes from the upstream release prebuilts (see the libs-*
# branches); this is the only artifact we compile ourselves.
#
# update-wgpu.sh dispatches it with the release it is vendoring and copies the
# artifact to libs-windows/arm64/libwgpu_native.a. The artifact records the
# release it was built from in WGPU_NATIVE_REF, which the script checks.

on:
  workflow_dispatch:
    inputs:
      wgpu_native_ref:
        description: >-
          wgpu-native release tag to build, e.g. v29.0.1.1. Must match the
          release the libs-* branches and the headers under wgpu/lib/ are
          vendored from: a mismatch is an ABI break.
        required: true
        type: string

env:
  WGPU_NATIVE_REF: ${{ inputs.wgpu_native_ref }}

jobs:
  build-wgpu:
    name: build - windows/arm64 (gnullvm)
    runs-on: windows-2022
    env:
      CARGO_BUILD_TARGET: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-pc-windows-gnullvm

      - name: Setup Environment
        shell: bash
        run: |
          set -ex
          # libclang for bindgen. The x64 host clang is fine — we only re-point
          # the *parse* target at aarch64 via BINDGEN_EXTRA_CLANG_ARGS below.
          choco install -y --force llvm | exit 0
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $GITHUB_ENV

          # llvm-mingw supplies the headers bindgen parses against. Parse in GNU
          # mode (--target=aarch64-w64-mingw32): mingw's vadefs.h has no GNU branch
          # for ARM64, so an MSVC-target parse over these headers dies with
          # "VARARGS not implemented for this TARGET".
          #
          # The sysroot is the toolchain ROOT, not the per-target directory: recent
          # llvm-mingw keeps one shared header tree at <root>/include and only libs
          # under <root>/aarch64-w64-mingw32. Pointing at the per-target dir gives
          # "'math.h' file not found". (Verified by building this natively on a
          # Windows-on-ARM host — belluikit/bellui#1.)
          LLVM_MINGW=llvm-mingw-20250430-ucrt-x86_64
          curl -sSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20250430/$LLVM_MINGW.zip
          7z x llvm-mingw.zip -oC:/ >/dev/null
          SYSROOT="C:/$LLVM_MINGW"
          test -f "$SYSROOT/include/math.h" || { echo "unexpected llvm-mingw layout: no $SYSROOT/include/math.h" >&2; exit 1; }
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_pc_windows_gnullvm=--target=aarch64-w64-mingw32 --sysroot=$SYSROOT" >> $GITHUB_ENV

          # rustc links aarch64-pc-windows-gnullvm with aarch64-w64-mingw32-clang,
          # which llvm-mingw ships in <root>/bin; without it on PATH the build
          # compiles and then dies on "linker `aarch64-w64-mingw32-clang` not found".
          test -x "$SYSROOT/bin/aarch64-w64-mingw32-clang.exe" || { echo "no aarch64-w64-mingw32-clang in $SYSROOT/bin" >&2; exit 1; }
          echo "$SYSROOT/bin" >> $GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          set -ex

          git clone --recursive --branch "$WGPU_NATIVE_REF" --depth 1 https://github.com/gfx-rs/wgpu-native.git tmp
          cd tmp

          # wgpu-native pins its own Rust in rust-toolchain.toml, and cargo honours
          # that pin over the toolchain the setup step installed — so the target has
          # to be added to the *pinned* toolchain, from inside the checkout. Without
          # this the build dies on "the `aarch64-pc-windows-gnullvm` target may not
          # be installed" while compiling windows-link.
          rustup show
          rustup target add aarch64-pc-windows-gnullvm

          # Bump bindgen so it understands a modern libclang AST (0.70
          # mis-traverses recent clang -> opaque structs). Build-only dep, does not
          # change the emitted FFI ABI.
          sed -i -E 's/^bindgen = .*/bindgen = "0.72"/' Cargo.toml
          grep -n '^bindgen' Cargo.toml

          cargo build --release --config profile.release.strip=\"symbols\"
          ls -al target/aarch64-pc-windows-gnullvm/release/

      - name: Check the archive carries no MSVC C++ ABI
        shell: bash
        run: |
          set -ex
          A=tmp/target/aarch64-pc-windows-gnullvm/release/libwgpu_native.a
          # The MSVC build's EH personality/type_info symbols are what llvm-mingw
          # cannot resolve; a GNU-ABI archive has none. Fail loudly if they appear.
          if strings "$A" | grep -qE '__CxxFrameHandler|type_info@@6B@'; then
            echo "archive still carries MSVC C++ ABI symbols" >&2
            exit 1
          fi

      - name: Record the release
        shell: bash
        run: printf '%s\n' "$WGPU_NATIVE_REF" > tmp/target/aarch64-pc-windows-gnullvm/release/WGPU_NATIVE_REF

      - uses: actions/upload-artifact@v7
        with:
          name: wgpu-windows-arm64-gnullvm
          path: |
            tmp/target/aarch64-pc-windows-gnullvm/release/libwgpu_native.a
            tmp/target/aarch64-pc-windows-gnullvm/release/WGPU_NATIVE_REF
